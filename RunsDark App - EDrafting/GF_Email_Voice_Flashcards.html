<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GF Email Voice — Flashcards</title><style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--ink:#e7e9ee;--muted:#9aa3b2;--line:#2a2f3a;--accent:#e8b54d}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:19px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
button:hover{border-color:#3a4150}.muted{color:var(--muted);font-size:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px;cursor:pointer;transition:border-color .15s;user-select:none}
.card:hover{border-color:#3a4150}
.chip{position:absolute;top:14px;left:16px;font-size:10.5px;color:#0f1115;background:var(--accent);border-radius:10px;padding:2px 9px;font-weight:700}
.side{position:absolute;top:14px;right:16px;font-size:11px;color:var(--muted)}
.q{font-size:19px;line-height:1.5;font-weight:600}.a{font-size:16px;line-height:1.6;color:#f0e9d8}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--muted);font-size:11px}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.progress{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:14px}
.progress>i{display:block;height:100%;background:var(--accent);width:0}
.count{font-variant-numeric:tabular-nums}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
</style></head><body><div class="wrap">
<h1>GF Email Voice — Flashcards</h1>
<p class="sub">Active recall for the email-voice doc. Click the card (or <kbd>Space</kbd>) to flip · <kbd>→</kbd>/<kbd>←</kbd> to move · <kbd>S</kbd> to shuffle.</p>
<div class="bar">
<select id="cat"><option value="__all">All categories</option><option value="Anti-patterns">Anti-patterns</option><option value="Humanizer">Humanizer</option><option value="Mechanics">Mechanics</option><option value="Philosophy">Philosophy</option><option value="Rules">Rules</option><option value="Tone">Tone</option><option value="Types">Types</option></select>
<button id="shuffle">Shuffle</button>
<button id="reset">Reset order</button>
<span class="muted count" id="count"></span>
<label class="muted" style="margin-left:auto"><input type="checkbox" id="qfirst" checked> Question first</label>
</div>
<div class="card" id="card"><span class="chip" id="chip"></span><span class="side" id="side"></span><div id="face" class="q"></div><div class="hint">click to flip</div></div>
<div class="progress"><i id="pbar"></i></div>
<div class="nav"><button id="prev">← Prev</button><span class="muted" id="pos"></span><button id="next">Next →</button></div>
</div>
<script>
const ALL=[{"q": "What is the email voice optimized for (vs. the essay voice)?", "a": "Trust maintenance and signal efficiency. The essay voice optimizes for rhetorical force (Saxon landings, structural negation, analogy as argument).", "c": "Philosophy"}, {"q": "What governs the length of a GF email?", "a": "Length matches the COMPLEXITY of the ask, not the importance of the relationship.", "c": "Philosophy"}, {"q": "What is the voice's single default 'instinct' (since it has no default length)?", "a": "Say what needs saying, then stop.", "c": "Philosophy"}, {"q": "Three essay-voice devices that are banned in email?", "a": "Saxon landings, ratchets, and structural negation.", "c": "Philosophy"}, {"q": "Why is relational softness allowed in email?", "a": "It's load-bearing \u2014 it keeps relationships alive. The essay voice would cut it.", "c": "Philosophy"}, {"q": "Most emails are how many sentences?", "a": "1\u20135 sentences. One-sentence emails are the norm for acknowledgments, delegations, and reactions.", "c": "Philosophy"}, {"q": "The three addressing registers?", "a": "1) Em dash 'Name \u2014' (default/outreach); 2) Hyphen 'Name -' or 'Hi Name -' (warm/ongoing); 3) Formal 'Hi [Name],' (first-contact, senior).", "c": "Mechanics"}, {"q": "Which address style leans toward ongoing relationships vs. outreach?", "a": "Hyphen leans ongoing relationships; em dash leans outreach.", "c": "Mechanics"}, {"q": "Formal address example for a senior first-contact?", "a": "'Hi Chetan,' / 'Hi Merritt,' / 'Dear Professor [Name],'", "c": "Mechanics"}, {"q": "What makes a subject line valid vs. a 'dangling dash'?", "a": "It must be a fragment WITH a subject. 'Today \u2014' is dangling; 'Today \u2014 Rescheduling' is valid.", "c": "Mechanics"}, {"q": "When can a question be the subject line?", "a": "Only for students / young builders. E.g. 'Networking on LI since you were 7?'", "c": "Mechanics"}, {"q": "Subject format for an intro email?", "a": "Name // Name \u2014 e.g. 'Samuel Ratnam // Luka Arnold'", "c": "Mechanics"}, {"q": "What do you do with reply-chain subjects?", "a": "Leave them alone \u2014 don't rewrite 'Re: Meeting Follow-Up' to be clever.", "c": "Mechanics"}, {"q": "Three subject-line patterns to avoid?", "a": "Dangling dash ('Today \u2014'), throat-clearing ('Checking in'/'Touching base'), over-formal ('Regarding our conversation on [date]').", "c": "Mechanics"}, {"q": "The cardinal rule for openers?", "a": "Never throat-clear. Start with substance. No 'Hope this finds you well,' no 'Just wanted to follow up.'", "c": "Mechanics"}, {"q": "How does an internal email open?", "a": "No opener \u2014 start with the directive.", "c": "Mechanics"}, {"q": "A good researcher cold-open?", "a": "'Spotted you're attending NeurIPS.' / 'I'm a Stanford '20, so I hope you don't mind the cold outreach.'", "c": "Mechanics"}, {"q": "A good congratulations/compliment opener?", "a": "'You are an absolutely G' / 'Thrilled for you' / 'This is fantastic'", "c": "Mechanics"}, {"q": "Allowed sign-offs?", "a": "'Best,' (formal/external), 'Sincerely,' (passes), a one-line warm closer ('Looking forward to March.'), or no sign-off / just the name on quick replies.", "c": "Mechanics"}, {"q": "Banned sign-offs?", "a": "'Best regards,', 'Cheers,', 'Warm regards,', 'Talk soon' as a standalone.", "c": "Mechanics"}, {"q": "Which CTA does GF NEVER use?", "a": "Any scheduling-tool CTA \u2014 never 'book a 30-min call' or 'here's my Calendly.'", "c": "Mechanics"}, {"q": "What CTA does GF use for outreach instead?", "a": "Offer the cell as low-friction: 'Here's my cell if easier: 408-612-5439.' It signals accessibility and seriousness.", "c": "Mechanics"}, {"q": "Which recipient gets the WARMEST register?", "a": "Portfolio founders (active). Personal context weaves in; relational language is load-bearing.", "c": "Tone"}, {"q": "Tone for internal team (Nazli, Jeff)?", "a": "Terse, directive, no pleasantries.", "c": "Tone"}, {"q": "Tone for stakeholders / LPs?", "a": "Warm but direct; acknowledge input, name specific actions, give the 'why' in longer emails. Softness is strategic.", "c": "Tone"}, {"q": "Tone for students / young builders?", "a": "Most casual; self-deprecating humor; position yourself to LEARN from them, not pitch; P.S. hooks; slang and emoji relaxed.", "c": "Tone"}, {"q": "Tone for peer / downstream VCs?", "a": "Thesis-led, not research-led. Hook = 'I think about the market the same way you do.' Use the '[Fund]-ready' framework.", "c": "Tone"}, {"q": "Co-GP (Eric) email: how do you open and what do you cut?", "a": "Lead with agreement ('I largely agree,' not 'I agree'), push back on exactly one thing with evidence, end with a question giving him agency. CUT anything he already said.", "c": "Tone"}, {"q": "Why use 'I largely agree' instead of 'I agree' with the co-GP?", "a": "It leaves room for your reframe / pushback without contradicting him.", "c": "Tone"}, {"q": "Cold outreach to researchers: questions or pitches?", "a": "Questions, not pitches \u2014 positions GF as intellectually curious, not transactional.", "c": "Types"}, {"q": "The 5 parts of a researcher cold email?", "a": "Hook line, research reference, genuine question(s), the ask ('25-minute chat at [Conf]?'), compact credential block with follow-on investors named.", "c": "Types"}, {"q": "In the researcher email, what must the credential block name?", "a": "Portfolio companies WITH their follow-on investors (e.g. Haize Labs \u2014 General Catalyst-backed).", "c": "Types"}, {"q": "Student/builder outreach: what makes the hook acceptable?", "a": "It must be SPECIFIC (a project, paper, hobby, mutual connection). Generic = delete.", "c": "Types"}, {"q": "What element of student/builder outreach often gets the reply?", "a": "The P.S. line with a personal detail signaling research depth (e.g. 'P.S. ... I'd be happy to be customer #10,001.').", "c": "Types"}, {"q": "Slush / downstream-VC outreach: is the personal hook optional?", "a": "No \u2014 every Slush email that got a response had one (dorm, geography, IB, specific personal detail).", "c": "Types"}, {"q": "The fixed 'ask' in a Slush downstream-VC email?", "a": "'I'd love to understand what [Fund]-ready looks like today, so that when something fits I'm only sending you the 1\u20132 companies a year worth your time.'", "c": "Types"}, {"q": "Surprising insight from the Slush batch?", "a": "The highest-caliber people responded MORE, not less. Thesis-led beats generic every time.", "c": "Types"}, {"q": "Two non-negotiables of an intro email?", "a": "LinkedIn links are mandatory; credential density is the currency.", "c": "Types"}, {"q": "How does an intro email close?", "a": "'I'll leave it to you to connect directly.'", "c": "Types"}, {"q": "Intro Menu / Promises Note \u2014 link format?", "a": "Raw URLs in parentheses after names (visible links beat hidden Markdown \u2014 the email is meant to be scanned and forwarded).", "c": "Types"}, {"q": "How do you soften a speculative intro in a promises note?", "a": "'Likely a good path,' 'happy to see how he can be helpful,' 'worth comparing notes.' Don't oversell.", "c": "Types"}, {"q": "The signature phrase in the cold pass?", "a": "'I view my role as an early-stage, pre-seed investor as a custodian of potential.'", "c": "Types"}, {"q": "The key 'no' line in the cold pass?", "a": "'Given the trust that founders give me to join their cap table, I must say no to excellent opportunities, even ones like yours.'", "c": "Types"}, {"q": "How does the cold pass close (sign-off + sentiment)?", "a": "'You deserve a wonderful fundraising experience.' then 'Sincerely,'", "c": "Types"}, {"q": "What does the cold-pass template accomplish?", "a": "Says no without closing the door \u2014 positions the pass as a function of process, not judgment.", "c": "Types"}, {"q": "Portfolio logistics email: how do you state the plan?", "a": "With a back-reference to the conversation that generated it: 'per our discussion last night.'", "c": "Types"}, {"q": "Two phrases that signal respect for a founder's judgment in coaching?", "a": "'I think' and 'my sense is.'", "c": "Types"}, {"q": "Are bullets allowed in email? When?", "a": "Yes \u2014 for multi-topic follow-ups. (Banned in the essay voice.) Each bullet self-contained: bold label + em dash + 1\u20133 sentences.", "c": "Types"}, {"q": "Article/link share: the critical structural move?", "a": "A labeled summary block ('The gist:') in a blockquote \u2014 marks it as NOT your words \u2014 with your one-line reaction OUTSIDE the quote.", "c": "Types"}, {"q": "Why must the link-share summary sit in a blockquote?", "a": "Without the separation a 2-paragraph summary reads as you lecturing; with it, the reader's attention lands on your reaction, not the summary.", "c": "Types"}, {"q": "Operational/internal email format?", "a": "No greeting, no sign-off. One job \u2014 state it and stop.", "c": "Types"}, {"q": "Why is 'Please review' an incomplete delegation?", "a": "It lacks specificity. 'Please review and see if any are worth meeting with, either together or separately' is actionable.", "c": "Types"}, {"q": "Is the analytical/thesis email terse?", "a": "No \u2014 the voice expands significantly. It tolerates longer paragraphs, semicolons, and parenthetical asides.", "c": "Types"}, {"q": "List the epistemic-hedge phrases that mark the analytical voice.", "a": "'I believe,' 'Perhaps,' 'appears as,' 'I think it's worth,' 'gives me some confidence.' They signal reasoning-in-progress, not a concluded memo.", "c": "Types"}, {"q": "'Single-topic discipline' means what?", "a": "Each analytical email delivers ONE insight the recipient doesn't already have, then stops. Multiple concerns = multiple emails.", "c": "Types"}, {"q": "Where does supporting evidence go in an analytical email?", "a": "Its own standalone paragraph, so it can breathe and land on its own (e.g. the $3B private-credit fund example).", "c": "Types"}, {"q": "When you're unsure of a conclusion, how do you frame it?", "a": "As a question, not an assertion: 'Perhaps his first 10\u201350 customers won't require brand trust?'", "c": "Types"}, {"q": "Where do validation/next-step references go?", "a": "Inside parentheticals: '(wanted to confirm this via AlphaSights !)' \u2014 shows verification without making it the subject.", "c": "Types"}, {"q": "Co-GP email: what must you NOT do with their flagged concerns?", "a": "Never restate their concerns back to them. Add information they don't have or shift a frame \u2014 agreement is implicit in acting on it.", "c": "Types"}, {"q": "How does a co-GP email end?", "a": "With a question that gives the co-GP agency (e.g. 'Curious whether this reframe is worth a quick pass to Prasanna').", "c": "Types"}, {"q": "Advisor/evaluator response: how much do you summarize their work back?", "a": "Don't. Open with one line of appreciation, translate their framework into your own words, add exactly ONE new piece of info, close with the next input coming. 5\u20137 short paragraphs max.", "c": "Types"}, {"q": "Adverbs to scan for and cut before sending?", "a": "genuinely, truly, incredibly, absolutely, fundamentally, basically, actually.", "c": "Rules"}, {"q": "Forbidden buzzwords (name several)?", "a": "leverage (verb), optimize, solution(s), seamless, robust, innovative, transform/transformative, synergy, journey, unlock, ecosystem, disruptive, scalable.", "c": "Rules"}, {"q": "Three 'false intimacy' phrases that are banned?", "a": "'Here's the thing,' 'Let me be real,' 'The truth is.'", "c": "Rules"}, {"q": "Preferred word for 'utilize'? 'optimize'? 'implement'?", "a": "use; improve; build.", "c": "Rules"}, {"q": "Preferred word for 'demonstrate'? 'facilitate'? 'embark'?", "a": "prove/show; help; start.", "c": "Rules"}, {"q": "Is 'Hope all is well' ever allowed?", "a": "Only as a brief tag \u2014 never as an opener.", "c": "Rules"}, {"q": "Which emoji is for internal quick acknowledgments only?", "a": "\ud83e\udd1d", "c": "Rules"}, {"q": "Reasoning-in-progress connectors \u2014 name a few and their job.", "a": "'Put differently,' 'In other words,' 'Which is to say,' 'The point being,' 'To be clear' \u2014 the seam between what you said and the sharper version. Use when distilling, not extending.", "c": "Rules"}, {"q": "Are personal qualifiers ('I have a preference for,' 'my sense is') hedges?", "a": "No \u2014 they're relational markers. 'I guess I disagree' is more honest than 'I disagree.'", "c": "Rules"}, {"q": "Top Humanizer rule for avoiding AI-sounding prose?", "a": "Vary sentence length dramatically \u2014 mix 3-word punches with longer flowing ones; occasional fragments / em-dashes.", "c": "Humanizer"}, {"q": "Humanizer rule when writing a BATCH of outreach?", "a": "Never use the same hook structure twice \u2014 vary the opening (Stanford / paper / personal detail / mutual connection).", "c": "Humanizer"}, {"q": "'Proactive context addition' \u2014 what is it?", "a": "When coordinating multiple parties, anticipate what each needs and include it unasked: 'Nazli will join us' / 'Nazli will circulate calendar options once you send your business address.'", "c": "Humanizer"}, {"q": "'Logistics chaining' \u2014 what is it?", "a": "Chain multiple action items in natural flow rather than bullet-pointing: 'Let's plan for X, per our discussion. [Person] will join. [Person] will handle [next step] once you [your part]. Ahead of [event], please bring [prep].'", "c": "Humanizer"}, {"q": "Why prefer 'I believe Katharos is selling productivity gains' over the flat assertion?", "a": "First person + belief verb signals it's your read, not settled fact \u2014 reasoning-in-progress. (Distinct from the more declarative cold-outreach voice.)", "c": "Humanizer"}, {"q": "The #1 AI failure mode these emails must avoid?", "a": "Restating someone's own analysis back to them. Add one new thing instead \u2014 agreement is implicit in acting on it.", "c": "Anti-patterns"}, {"q": "'Action > announcement' means what?", "a": "Never narrate your to-do list ('I'll pursue the call you recommended'). The recipient sees the intro when you make it.", "c": "Anti-patterns"}, {"q": "Why not list technical details to prove you understood?", "a": "It reads as proving you read the doc. 'Proprietary ER graph' is enough \u2014 trust the recipient to ask for specifics.", "c": "Anti-patterns"}, {"q": "What must an intro menu never become?", "a": "A diligence memo \u2014 no uncertainty log, no full bio for every person. Just the shortlist, links, and next handle.", "c": "Anti-patterns"}, {"q": "The voice progression across the sample sets (formal \u2192 target)?", "a": "ICML (formal, longer) \u2192 NeurIPS (tighter, more personality) \u2192 LinkedIn/Boston (punchiest, most human) \u2192 Slush VC (thesis-led, heaviest credentials). Later = target voice.", "c": "Philosophy"}, {"q": "Which reference file matters most, per the skill?", "a": "references/samples.md \u2014 'If you only read one reference, read that one.'", "c": "Philosophy"}];
let pool=ALL.slice(), i=0, showingQ=true;
const card=document.getElementById('card'),face=document.getElementById('face'),chip=document.getElementById('chip'),side=document.getElementById('side');
const pos=document.getElementById('pos'),count=document.getElementById('count'),pbar=document.getElementById('pbar'),qfirst=document.getElementById('qfirst');
function render(){
  const c=pool[i]; if(!c){face.textContent='No cards in this category.';return;}
  showingQ=qfirst.checked;
  face.className=showingQ?'q':'a'; face.textContent=showingQ?c.q:c.a;
  chip.textContent=c.c.replace(/_/g,' '); side.textContent=showingQ?'Q':'A';
  pos.textContent=(i+1)+' / '+pool.length; count.textContent=pool.length+' cards';
  pbar.style.width=((i+1)/pool.length*100)+'%';
}
function flip(){const c=pool[i];if(!c)return;showingQ=!showingQ;face.className=showingQ?'q':'a';face.textContent=showingQ?c.q:c.a;side.textContent=showingQ?'Q':'A';}
function next(){if(i<pool.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
function shuffle(){for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}i=0;render();}
function applyCat(){const v=document.getElementById('cat').value;pool=(v==='__all')?ALL.slice():ALL.filter(c=>c.c===v);i=0;render();}
card.addEventListener('click',flip);
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('shuffle').onclick=shuffle;
document.getElementById('reset').onclick=()=>{applyCat();};
document.getElementById('cat').onchange=applyCat;
qfirst.onchange=render;
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip();}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key.toLowerCase()==='s')shuffle();});
render();
</script></body></html>
